<!DOCTYPE html>
<html lang="en">
<head>

<title>Topics — SIP Portal</title>

</head>
<body data-page="topics">
<div class="bg-mesh"></div><div class="bg-dots"></div>

<nav class="navbar">
  <div style="display:flex;align-items:center;gap:12px">
    <button class="menu-btn" id="menuBtn">☰</button>
    <a href="index.html" class="nav-brand">SIP<span>Portal</span></a>

  <div class="nav-links">
    <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
  </div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-layout">

      <div class="sidebar-role">Interview Candidate</div>

    <nav class="sidebar-nav">

      <div class="sidebar-section">Topics</div>
      <a href="quiz.html?topic=html&mode=interview" class="sidebar-link"><div class="icon">🌐</div>HTML</a>

    <div class="topics-grid" id="topicsGrid">
      <div style="color:var(--text-muted);padding:40px">Loading topics...</div>
    </div>
  </main>

<script src="js/questions.js"></script>
<script src="js/script.js"></script>
