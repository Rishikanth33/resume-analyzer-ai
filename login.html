<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SIP Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<div class="bg-mesh"></div><div class="bg-dots"></div>

<nav class="navbar">
  <a href="index.html" class="nav-brand">SIP<span>Portal</span></a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">← Back Home</a>
  </div>
</nav>

<div class="login-page">
  <div class="glass-card login-box">
    <div class="login-logo">
      <div class="login-logo-icon">🎯</div>
      <h1 class="login-title">Welcome Back</h1>
      <p class="login-sub">Sign in to continue your prep journey</p>
    </div>

    <div class="login-tabs">
      <div class="login-tab active">Sign In</div>
      <div class="login-tab">Register</div>
    </div>

    <!-- LOGIN FORM -->
    <div class="login-form-panel">
      <div class="alert" id="loginAlert" style="display:none"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input class="form-control" type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-control" type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-bottom:20px">
          <span class="forgot-link">Forgot password?</span>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Sign In →</button>
      </form>
      <div class="divider">or try demo</div>
      <button class="btn btn-ghost" style="width:100%;justify-content:center" onclick="demoLogin()">⚡ Demo Login</button>
    </div>

    <!-- REGISTER FORM -->
    <div class="login-form-panel" style="display:none">
      <div class="alert" id="regAlert" style="display:none"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input class="form-control" type="text" id="regName" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input class="form-control" type="email" id="regEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-control" type="password" id="regPassword" placeholder="Min. 6 characters" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input class="form-control" type="password" id="regConfirm" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Create Account →</button>
      </form>
    </div>
  </div>
</div>

<script src="js/questions.js"></script>
<script src="js/script.js"></script>
<script>
function demoLogin() {
  const users = JSON.parse(localStorage.getItem('sip_users') || '[]');
  let demo = users.find(u => u.email === 'demo@sipportal.com');
  if (!demo) {
    demo = { name: 'Demo User', email: 'demo@sipportal.com', password: 'demo123', joined: new Date().toISOString() };
    users.push(demo);
    localStorage.setItem('sip_users', JSON.stringify(users));
  }
  localStorage.setItem('sip_user', JSON.stringify(demo));
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
